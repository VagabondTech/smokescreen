# Builds the demo for browsers with WebGPU (see web/README.md), and publishes
# main to GitHub Pages: https://vagabondtech.github.io/smokescreen/. Turn Pages
# on first (Settings → Pages → Source: GitHub Actions), or the deploy fails.
name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "examples/demo.rs"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push to the same branch or pull request makes this build moot.
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen, exactly the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Build the demo
        run: cargo build --profile web --example demo --target wasm32-unknown-unknown --features webgpu
      # Without the name section (function names, for stack traces) the module
      # is 44 MB instead of 110 MB, 8.7 MB gzipped.
      - name: JavaScript bindings
        run: >-
          wasm-bindgen --no-typescript --remove-name-section --target web --out-dir web/pkg --out-name demo
          target/wasm32-unknown-unknown/web/examples/demo.wasm
      # Each of GitHub Pages' CDN servers fetches a file it hasn't got from
      # GitHub slowly (35-150 KB/s, seen from Cape Town) and keeps it for only
      # 10 minutes. Gzipped, the module is a fifth of the size; in 1 MB pieces,
      # which the page fetches side by side, several parts come at once.
      - name: Gzip the module and cut it into pieces
        working-directory: web/pkg
        run: |
          gzip -9 -k -n demo_bg.wasm
          split -b 1M -d -a 2 demo_bg.wasm.gz demo_bg.wasm.gz.
          files=$(ls demo_bg.wasm.gz.[0-9][0-9] | sed 's/.*/"&"/' | paste -sd, -)
          echo "{\"size\": $(stat -c %s demo_bg.wasm.gz), \"files\": [$files]}" > demo_bg.wasm.gz.json
          cat demo_bg.wasm.gz.json
      # The API map for coding assistants, at the site's root like the
      # crates' homepage: https://vagabondtech.github.io/smokescreen/llms.txt.
      - name: llms.txt
        if: github.ref == 'refs/heads/main'
        run: cp llms.txt web/
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: web

  # Only main is published. Deploys queue rather than cancel each other, so
  # none is stopped half-way.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
