[package]
name = "bevy_smokescreen"
version = "0.1.1"
edition = "2024"
# Bevy 0.20's minimum.
rust-version = "1.97.1"
description = "Smoke for Bevy that fills rooms, flows through doorways and blocks sight: grenades, smoke walls, gas, fog banks; volumetric, faceted or crystal; deterministic gameplay queries"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bevy", "smoke", "volumetric", "gamedev", "multiplayer"]
categories = ["game-development", "rendering", "simulation"]
repository = "https://github.com/VagabondTech/smokescreen"
# The demo, in a browser.
homepage = "https://vagabondtech.github.io/smokescreen/"
# CLAUDE.md is for sessions working on this repository; coding assistants using
# the crate read llms.txt, which the package carries.
exclude = ["docs/*.jpg", "docs/media/", "tools/", "web/", ".github/", "CLAUDE.md"]

[workspace]
members = ["smokescreen"]
# Resolver 2, not 3: with resolver 3 (MSRV-aware), smokescreen's lower
# rust-version would hold Bevy's dependencies back on `cargo update`.
resolver = "2"

[features]
# Draw through WebGPU in the browser (wasm32); see web/ and .github/workflows/web.yml.
webgpu = ["bevy/webgpu"]
# Serialize and Deserialize on SmokeBullet and SmokeExplosion, and on the
# core's CloudSpec and Impact (smokescreen's serde feature).
serde = ["dep:serde", "smokescreen/serde"]

[package.metadata.docs.rs]
features = ["serde"]

[dependencies]
smokescreen = { path = "smokescreen", version = "0.1.1" }
serde = { version = "1.0.200", default-features = false, features = ["derive"], optional = true }
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "default_app",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_image",
    "bevy_shader",
] }

bytemuck = "1"

[dev-dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "default_app",
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    # Draws the demo's bullet tracers and sight lines.
    "bevy_gizmos_render",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "ui_api",
    "ui_bevy_render",
    "png",
] }

# llms.txt's glTF recipe, compiled as a doc test, uses Bevy's scene types
# (WorldAssetRoot, WorldInstanceReady). Native only, so the browser demo's
# download doesn't grow.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["bevy_world_serialization"] }

# In a browser, the demo reads its settings from the page's address and the
# page's pointer lock, asks whether the main pointer is a finger, and tells
# the page when it's drawing (web/index.html).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3", features = ["Document", "Element", "Location", "MediaQueryList", "Window"] }

# Bevy's recommended dev settings: optimise dependencies, keep this crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser builds (`--profile web`, see web/README.md): smaller downloads.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
