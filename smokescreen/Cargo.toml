[package]
name = "smokescreen"
version = "0.2.0"
edition = "2024"
# Let chains. Std APIs are checked against this by clippy's `incompatible_msrv`.
rust-version = "1.88"
description = "Deterministic smoke simulation for games and servers: flood fill through levels, three looks, bullet and explosion holes, bit-identical line-of-sight queries, no engine"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["smoke", "deterministic", "gamedev", "line-of-sight", "multiplayer"]
categories = ["game-development", "simulation"]
repository = "https://github.com/VagabondTech/smokescreen"

[features]
# Serialize and Deserialize on what machines send each other: CloudSpec (with
# CloudSource, Style and Timeline) and Impact. Without it, the crate depends
# on glam and libm only.
serde = ["dep:serde", "glam/serde"]

[dependencies]
glam = "0.33"
libm = "0.2"
serde = { version = "1.0.200", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# A binary format for the serde tests (tests/serde.rs).
postcard = { version = "1", default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
features = ["serde"]

[[bench]]
name = "queries"
harness = false
